# pnpm の設定置き場（ワークスペース運用はしていない）。
#
# wrangler の推移的依存 (esbuild / sharp / workerd) はビルドスクリプトを持つが、
# .npmrc の ignore-scripts=true の方針どおり実行を「拒否」する。
# 明示しないと pnpm 11 はインストールを ERR_PNPM_IGNORED_BUILDS で失敗させる。
# いずれもビルドスクリプト無しで動く: esbuild/workerd はバイナリを
# optionalDependencies で取得し、sharp は deploy 経路では使われない。
# style-dictionary とその推移的依存 @bundled-es-modules/glob も同方針で拒否
# （どちらもビルドスクリプト無しで動作することを tokens:build の実行で確認済み）。
allowBuilds:
  '@bundled-es-modules/glob': false
  esbuild: false
  sharp: false
  style-dictionary: false
  workerd: false
# 推移的依存を更新版以上に揃える。
overrides:
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=8.0.0 <8.12.2: ^8.12.2
  sharp@<0.35.5: ^0.35.5
  vite@>=8.0.0 <8.3.3: ^8.3.3
  zod@>=4.0.0 <4.6.6: ^4.6.6
  source-map-js@<1.2.2: ^1.2.2
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6

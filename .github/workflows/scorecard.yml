name: Scorecard supply-chain security

# Runs the OpenSSF Scorecard on a schedule (and on push to main) to score
# the repo against supply-chain best practices: pinned dependencies, branch
# protection, dangerous workflows, token permissions, etc.
# Results are uploaded to:
#   1. GitHub Security tab (Code scanning) via SARIF
#   2. publish-results=true reports to the OpenSSF API so the score appears
#      on https://scorecard.dev/

on:
  branch_protection_rule:
  schedule:
    - cron: "21 9 * * 1" # Monday 09:21 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to the Code scanning dashboard.
      security-events: write
      # Needed for the OIDC token used by publish_results.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
